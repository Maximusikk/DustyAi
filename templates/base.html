<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PC Cleaner{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--surface-2:#f3f5f9;--border:#e6eaf1;--fg:#172033;--muted:#738096;
  --accent:#2f7cf6;--accent-soft:#e8f0fe;--shadow:0 1px 2px rgba(20,30,50,.04),0 8px 24px rgba(20,30,50,.05);
  --a:#16a34a;--a-bg:#dcfce7;--b:#b45309;--b-bg:#fef3c7;--c:#dc2626;--c-bg:#fee2e2;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#9aa3b2;
  --overlay:rgba(15,23,42,.45);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0f12;--surface:#161a20;--surface-2:#1c212a;--border:#252b35;--fg:#e8ecf1;--muted:#8591a3;
  --accent:#4d94ff;--accent-soft:#1a2740;--shadow:none;
  --a:#4ade80;--a-bg:#12301f;--b:#fbbf24;--b-bg:#33290d;--c:#f87171;--c-bg:#38171a;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#6b7585;
  --overlay:rgba(0,0,0,.6);}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif;display:flex}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
aside{width:224px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:22px 14px;
  display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px 22px}
.brand .tile{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-size:19px}
.brand b{display:block;font-size:15px}.brand small{color:var(--muted);font-size:12px}
.nav-title{font-size:11px;letter-spacing:.14em;color:var(--muted);padding:8px 10px;font-weight:600;text-transform:uppercase}
aside a.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--fg);
  text-decoration:none;font-weight:500;transition:.15s}
aside a.nav:hover{background:var(--surface-2)}aside a.nav.on{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border)}
aside a.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;color:var(--muted);font-size:12px;padding:10px;line-height:1.4}
main{flex:1;min-width:0;height:100vh;overflow-y:auto}
.wrap{max-width:1180px;margin:0 auto;padding:28px 32px 72px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:700;text-transform:uppercase}
h1{margin:4px 0 4px;font-size:30px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:15px}.card .hint{color:var(--muted);font-size:13px;margin:2px 0 14px}
.btn{font:inherit;font-weight:500;background:var(--surface);color:var(--fg);border:1px solid var(--border);
  border-radius:11px;padding:9px 16px;cursor:pointer;text-decoration:none;transition:.15s;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--muted)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--c);border-color:var(--c);color:#fff}
.btn.danger:disabled{background:var(--c-bg);border-color:var(--c-bg);color:var(--c);opacity:1}
.badge{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:99px;font-size:12px;font-weight:700}
.badge.A{background:var(--a-bg);color:var(--a)}.badge.B{background:var(--b-bg);color:var(--b)}.badge.C{background:var(--c-bg);color:var(--c)}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--a-bg);color:var(--a);font-weight:500}
.app-ico{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;background:var(--surface-2);
  font-size:15px;overflow:hidden}.app-ico img{width:22px;height:22px;object-fit:contain}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--a);box-shadow:0 8px 24px rgba(0,0,0,.18);
  padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(8px);transition:.25s;max-width:360px}
.toast.show{opacity:1;transform:none}.toast.err{border-left-color:var(--c)}
@media(max-width:820px){aside{display:none}.wrap{padding:20px 16px 64px}}
</style>
{% block head %}{% endblock %}
</head>
<body>
<aside>
  <div class="brand"><div class="tile">🧹</div><div><b>PC Cleaner</b><small>Умная очистка диска</small></div></div>
  <div class="nav-title">Меню</div>
  <a class="nav {{ 'on' if active == 'home' }}" href="/"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Главная</a>
  <a class="nav {{ 'on' if active == 'report' }}" href="/report"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 16v-5M12 16V8M16 16v-3"/></svg>Отчёт</a>
  <a class="nav {{ 'on' if active == 'history' }}" href="/history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>История</a>
  <div class="side-foot">🔒 Всё работает локально — данные никуда не отправляются.</div>
</aside>
<main><div class="wrap">{% block body %}{% endblock %}</div></main>
<div id="toasts"></div>
<script>
function toast(msg, err){const t=document.createElement('div');t.className='toast'+(err?' err':'');
t.textContent=msg;document.getElementById('toasts').appendChild(t);
requestAnimationFrame(()=>t.classList.add('show'));
setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},5000);}
try{const m=sessionStorage.getItem('toast');if(m){sessionStorage.removeItem('toast');toast(m)}}catch(_){}
</script>
{% block script %}{% endblock %}
</body></html>
