<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PC Cleaner{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f12;--surface:#161a20;--border:#252b35;--fg:#e8ecf1;--muted:#6b7585;
--accent:#4ade80;--amber:#fbbf24;--red:#f87171;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,sans-serif}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 64px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font-weight:700;font-size:18px}
a.btn,button.btn{font:inherit;background:var(--surface);color:var(--fg);border:1px solid var(--border);
border-radius:10px;padding:9px 16px;cursor:pointer;text-decoration:none;transition:.15s}
a.btn:hover,button.btn:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:#052e16;border-color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:9}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);
padding:12px 16px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.25s;max-width:340px}
.toast.show{opacity:1;transform:none}.toast.err{border-left-color:var(--red)}
</style>
{% block head %}{% endblock %}
</head>
<body><div class="wrap">{% block body %}{% endblock %}</div><div id="toasts"></div>
<script>
function toast(msg, err){const t=document.createElement('div');t.className='toast'+(err?' err':'');
t.textContent=msg;document.getElementById('toasts').appendChild(t);
requestAnimationFrame(()=>t.classList.add('show'));
setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},4500);}
async function startScan(){
  const r=await fetch('/scan',{method:'POST'});if(!r.ok)return;poll();
}
</script>
{% block script %}{% endblock %}
</body></html>
