name: Build Windows exe

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build DustyAi.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name DustyAi --icon assets/dustyai.ico --add-data "templates;templates" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: DustyAi-windows
          path: dist/DustyAi.exe
      - name: Work out the release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"; fi
      - name: Publish release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Dusty Ai ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/DustyAi.exe
