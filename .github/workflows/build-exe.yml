name: Build Windows release

# Builds DustyAi-windows.zip (PyInstaller "onedir" with a bootloader compiled on the runner: this combination had
# 0 detections on VirusTotal where the stock single-file exe had 8). A GitHub Release is published when a v* tag is
# pushed or when this workflow is started manually with a release tag.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v1.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install app dependencies
        run: python -m pip install -r requirements.txt
      - name: Install PyInstaller with a bootloader built from source
        shell: bash
        run: |
          python -m pip install wheel setuptools
          git clone --depth 1 --branch v6.11.1 https://github.com/pyinstaller/pyinstaller.git "$RUNNER_TEMP/pyi"
          cd "$RUNNER_TEMP/pyi/bootloader"
          python ./waf all
          cd ..
          python -m pip install .
      - name: Build DustyAi
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name DustyAi \
            --icon assets/dustyai.ico --version-file packaging/version.txt \
            --add-data "templates;templates" app.py
      - name: Package
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/DustyAi/LICENSE
          Compress-Archive -Path dist/DustyAi -DestinationPath DustyAi-windows.zip
          Get-FileHash DustyAi-windows.zip -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: DustyAi-windows
          path: DustyAi-windows.zip
      - name: Work out the release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"; fi
      - name: Publish release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Dusty Ai ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: DustyAi-windows.zip
