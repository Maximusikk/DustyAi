name: Build Windows exe

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build DustyAi.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name DustyAi --add-data "templates;templates" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: DustyAi-windows
          path: dist/DustyAi.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Dusty Ai build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: dist/DustyAi.exe
