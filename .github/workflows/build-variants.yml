name: Build variants (antivirus false-positive comparison)

# Manual only. Builds the app in three packagings so each can be scanned on virustotal.com and the one with the
# fewest false positives can become the release format.
on:
  workflow_dispatch:

jobs:
  variant:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: onedir-default       # folder + zip, stock PyInstaller bootloader
            mode: onedir
            bootloader: stock
          - name: onedir-custom-boot   # folder + zip, PyInstaller bootloader compiled on the runner
            mode: onedir
            bootloader: source
          - name: onefile-custom-boot  # single exe, bootloader compiled on the runner
            mode: onefile
            bootloader: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install app dependencies
        run: python -m pip install -r requirements.txt
      - name: Install PyInstaller (stock)
        if: matrix.bootloader == 'stock'
        run: python -m pip install pyinstaller
      - name: Install PyInstaller (bootloader built from source)
        if: matrix.bootloader == 'source'
        shell: bash
        run: |
          python -m pip install wheel setuptools
          git clone --depth 1 --branch v6.11.1 https://github.com/pyinstaller/pyinstaller.git "$RUNNER_TEMP/pyi"
          cd "$RUNNER_TEMP/pyi/bootloader"
          python ./waf all
          cd ..
          python -m pip install .
      - name: Build
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --${{ matrix.mode }} --windowed --name DustyAi \
            --icon assets/dustyai.ico --version-file packaging/version.txt \
            --add-data "templates;templates" app.py
      - name: Package
        shell: pwsh
        run: |
          if ("${{ matrix.mode }}" -eq "onedir") {
            Compress-Archive -Path dist/DustyAi/* -DestinationPath "DustyAi-${{ matrix.name }}.zip"
          } else {
            Copy-Item dist/DustyAi.exe "DustyAi-${{ matrix.name }}.exe"
          }
          Get-FileHash DustyAi-${{ matrix.name }}.* -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: DustyAi-${{ matrix.name }}
          path: DustyAi-${{ matrix.name }}.*
